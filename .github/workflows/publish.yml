name: publish

# Build + push the Rust container image to GHCR (ghcr.io/oxyc/den-atlas) on a v* tag or a manual run.
# CI has no dataset blobs (gitignored), so the published image is the SERVER ONLY — mount data at runtime:
#   docker run -p 8080:8080 -v /path/to/data:/app/data ghcr.io/oxyc/den-atlas:latest
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Single source of truth: the manifest reads env!("CARGO_PKG_VERSION"), and the image tag is the
      # git tag — so a v* tag must equal v<Cargo.toml version> or the release version would be a lie.
      # Fail fast on a mismatch (skipped on workflow_dispatch, which has no tag).
      - name: Tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag_v="${GITHUB_REF_NAME#v}"
          echo "Cargo.toml=$cargo_v  tag=$tag_v"
          test "$cargo_v" = "$tag_v" || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml version $cargo_v — bump Cargo.toml before tagging"; exit 1; }

      - name: cargo test
        run: cargo test --locked

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

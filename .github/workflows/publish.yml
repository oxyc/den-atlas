name: publish

# Build + push the Rust container image to GHCR (ghcr.io/oxyc/den-atlas) on a v* tag or a manual run.
# CI has no dataset blobs (gitignored), so the published image is the SERVER ONLY — mount data at runtime:
#   docker run -p 8080:8080 -v /path/to/data:/app/data ghcr.io/oxyc/den-atlas:latest
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cargo test
        run: cargo test --locked

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

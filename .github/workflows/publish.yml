name: publish

# Build + push the container image to GitHub Container Registry (ghcr.io/oxyc/den-atlas).
# Triggers: pushing a v* tag (release), or a manual run. CI has no dataset blobs (they're gitignored), so
# the PUBLISHED image is the SERVER ONLY — mount the data at runtime:
#   docker run -p 8080:8080 -v /path/to/data:/app/data ghcr.io/oxyc/den-atlas:latest
# (A data-included image is produced by a LOCAL `npm run import && docker build` — see DEPLOY.md.)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # A v1.2.3 tag → images :1.2.3 and :latest; a manual run → :latest.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

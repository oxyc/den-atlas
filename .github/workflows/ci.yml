name: ci

# Tests, lints and the release build, on every push and PR. Until now the only workflow here was
# publish.yml, which builds an image on a v* tag — so a tagged release was the first thing that ever
# compiled the code on anything but a developer's machine, and the test suite ran only when someone
# remembered to type the command. Several rounds of audit findings were guarded solely by tests that
# nothing executed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --locked

      # Denied, not reported. The lint set here is small and the codebase is clean, so a new warning
      # is a real signal rather than background noise to scroll past.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # rustfmt.toml is tuned to how this codebase was already written (see the comments there), so
      # this gate holds the existing style rather than imposing a new one.
      - name: Formatting
        run: cargo fmt --check

      # The catalog talks to JustWatch over the network at runtime, and an audit probe once put
      # enough load on it to earn the host a 403. Nothing in CI should reach it.
      #
      # This checks the string, and a string check has a real gap: a test that builds a default
      # client reaches the live host without ever naming it, which is plausibly how that 403
      # happened. That gap is closed in the code rather than here — `AppState::for_test` wires an
      # offline source — because a CI job cannot see it. Comment lines are excluded so prose about
      # the host stays allowed.
      - name: The live host is named only by ENDPOINT
        run: |
          # The comment filter is anchored to just after "file:line:", because an unanchored
          # ":[[:space:]]*//" also matches the "://" inside the URL itself — which silently
          # excluded every line the check exists to find.
          if grep -rn "apis\.justwatch\.com" src/ --include='*.rs' \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' \
             | grep -v 'const ENDPOINT'; then
            echo "::error::something other than the ENDPOINT constant names the live JustWatch host"
            exit 1
          fi
          echo "ok — the live host is named only by ENDPOINT"

      # There is deliberately no "run the suite with networking off" job to go with it. The gap the
      # grep cannot see — a test reaching the host through a default-constructed client — is closed
      # in the code instead: AppState::for_test wires an offline source, so no route test can reach
      # JustWatch however it is written. A guard that cannot be run here is not a guard.

  # The image is what actually ships, and it builds differently from `cargo build` (musl target,
  # scratch base). Catching a Dockerfile break here rather than at `git tag` time.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Same action majors publish.yml uses. The job exists to catch a Dockerfile break before a
      # v* tag does, which it cannot do well from a different builder.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

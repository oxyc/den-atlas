name: ci

# Tests, lints and the release build, on every push and PR. Until now the only workflow here was
# publish.yml, which builds an image on a v* tag — so a tagged release was the first thing that ever
# compiled the code on anything but a developer's machine, and the test suite ran only when someone
# remembered to type the command. Several rounds of audit findings were guarded solely by tests that
# nothing executed.
#
# Every exact main commit also produces a scanned, immutable candidate image while its checks run. A release
# tag only promotes that already-tested digest (docker-publish.yml); it never recompiles or reruns this workflow.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR revisions are disposable. A main SHA is a potential release and its candidate must finish even
  # when another merge follows it, otherwise a tag could name a commit whose exact image was cancelled midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository_owner }}/den-atlas
  EMBED_IMAGE: ghcr.io/${{ github.repository_owner }}/den-atlas-embed
  INTEGRATED_IMAGE: ghcr.io/${{ github.repository_owner }}/den-atlas-integrated

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # den-spec holds the store format's test vectors. Checked out beside this repo because the store
      # and rail tests read them — and FAIL without them, deliberately: they exist to catch the rail
      # drifting from the format, which they can only do if they can find the fixture. Both used to
      # resolve it one directory too far up and skip, reporting a pass over a store never opened.
      - uses: actions/checkout@v7
        with:
          repository: oxyc/den-spec
          path: den-spec-checkout
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Release helper
        run: scripts/release-test.sh

      - name: Tests
        run: cargo test --locked --workspace
        env:
          DEN_SPEC_DIR: ${{ github.workspace }}/den-spec-checkout

      # The normal binary deliberately keeps using the external service. Compile the opt-in migration
      # path too, so it cannot silently rot before its separate image is ready to canary.
      - name: Integrated embedding path compiles
        run: cargo check --locked -p den-atlas --features embedded-model

      # Denied, not reported. The lint set here is small and the codebase is clean, so a new warning
      # is a real signal rather than background noise to scroll past.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # rustfmt.toml is tuned to how this codebase was already written (see the comments there), so
      # this gate holds the existing style rather than imposing a new one.
      - name: Formatting
        run: cargo fmt --all --check

      # The catalog talks to JustWatch over the network at runtime, and an audit probe once put
      # enough load on it to earn the host a 403. Nothing in CI should reach it.
      #
      # This checks the string, and a string check has a real gap: a test that builds a default
      # client reaches the live host without ever naming it, which is plausibly how that 403
      # happened. That gap is closed in the code rather than here — `AppState::for_test` wires an
      # offline source — because a CI job cannot see it. Comment lines are excluded so prose about
      # the host stays allowed.
      - name: The live host is named only by ENDPOINT
        run: |
          # The comment filter is anchored to just after "file:line:", because an unanchored
          # ":[[:space:]]*//" also matches the "://" inside the URL itself — which silently
          # excluded every line the check exists to find.
          if grep -rn "apis\.justwatch\.com" src/ --include='*.rs' \
             | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' \
             | grep -v 'const ENDPOINT'; then
            echo "::error::something other than the ENDPOINT constant names the live JustWatch host"
            exit 1
          fi
          echo "ok — the live host is named only by ENDPOINT"

      # There is deliberately no "run the suite with networking off" job to go with it. The gap the
      # grep cannot see — a test reaching the host through a default-constructed client — is closed
      # in the code instead: AppState::for_test wires an offline source, so no route test can reach
      # JustWatch however it is written. A guard that cannot be run here is not a guard.

  # den-index and den-titlesearch are meant to be pulled into a future Rust core linked into the tvOS app
  # (UniFFI) and the web app (Wasm), so they have to keep compiling for both. A check, not a build: nothing
  # links.
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-apple-tvos
      - uses: Swatinem/rust-cache@v2
      - name: The portable crates compile for Wasm and tvOS
        run: |
          cargo check --locked -p den-index -p den-titlesearch --target wasm32-unknown-unknown
          cargo check --locked -p den-index -p den-titlesearch --target aarch64-apple-tvos

  # The image is what actually ships, and it builds differently from `cargo build` (musl target,
  # scratch base). Catching a Dockerfile break on the PR rather than at `git tag` time, without
  # pushing, for amd64 — the only arch the box runs. It reads main's cache but deliberately does not write it,
  # so an unmerged revision never overwrites the release cache.
  build-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read release metadata
        id: source
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION is not X.Y.Z: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          targets: release
          vars: |
            DEN_VERSION=${{ steps.source.outputs.version }}
            GIT_REVISION=${{ github.sha }}
            ATLAS_IMAGE=${{ env.IMAGE }}
            EMBED_IMAGE=${{ env.EMBED_IMAGE }}
            INTEGRATED_IMAGE=${{ env.INTEGRATED_IMAGE }}
          set: |
            *.pull=true
            *.output=type=cacheonly
            atlas.cache-from=type=gha,scope=release-image
            compat.cache-from=type=gha,scope=optional-release-image
            integrated.cache-from=type=gha,scope=optional-release-image

  # Main builds and scans an immutable candidate while the test jobs run. It is intentionally unsigned and never
  # receives :latest here; docker-publish promotes it only after this exact workflow has succeeded.
  candidate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write  # Trivy's report goes to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release metadata
        id: source
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION is not X.Y.Z: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      # amd64 only: it is the one arch the box runs.
      - name: Build and push the candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ env.IMAGE }}:candidate-${{ github.sha }}
          build-args: |
            DEN_VERSION=${{ steps.source.outputs.version }}
            GIT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
          # SLSA provenance and an SBOM, attached to the image index and so covered by its signature.
          provenance: mode=max
          sbom: true
      - name: Prove the image reports its release version
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE@$DIGEST" >/dev/null
          id=$(docker run --rm -d -p 127.0.0.1:18080:8080 "$IMAGE@$DIGEST")
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          body=""
          for _ in $(seq 1 20); do
            body=$(curl -fsS http://127.0.0.1:18080/manifest.json 2>/dev/null) && break
            sleep 1
          done
          got=$(jq -r .version <<<"$body")
          test "$got" = "$VERSION" || { echo "::error::image /manifest.json version is $got, expected $VERSION"; exit 1; }
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          version: v0.74.0
          format: json
          output: trivy.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      # Gate: a CRITICAL with a fixed version available fails here, before the digest is recorded. A finding
      # that does not apply goes in .trivyignore with a reason.
      - name: Gate on fixable critical findings
        run: trivy convert --severity CRITICAL --exit-code 1 --format table trivy.json
      - name: Bind this CI run to its candidate digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          jq -n --arg image "$DIGEST" '{image: $image}' > candidate-digests.json
      - name: Save candidate identity for release promotion
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate-digests.json
          if-no-files-found: error
          retention-days: 30
      - name: Report for code scanning
        continue-on-error: true
        run: trivy convert --format sarif --output trivy.sarif trivy.json
      - name: Upload scan to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        # The report is advisory: a code-scanning outage must not hold a release.
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  # These images are published beside the normal candidate, but they do not replace it and no deploy reads
  # them. The compatibility service lets den-dataset move to the Atlas-owned engine first; the integrated
  # image is an explicit later-rollout artifact. Both share one bake so the model and glibc build are reused.
  optional-candidate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read release metadata
        id: source
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION is not X.Y.Z: $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build and push optional candidates
        id: build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          targets: optional
          push: true
          provenance: mode=max
          sbom: true
          vars: |
            TAG=candidate-${{ github.sha }}
            DEN_VERSION=${{ steps.source.outputs.version }}
            GIT_REVISION=${{ github.sha }}
            ATLAS_IMAGE=${{ env.IMAGE }}
            EMBED_IMAGE=${{ env.EMBED_IMAGE }}
            INTEGRATED_IMAGE=${{ env.INTEGRATED_IMAGE }}
          set: |
            *.pull=true
            *.cache-from=type=gha,scope=optional-release-image
            compat.cache-to=type=gha,mode=max,scope=optional-release-image
      - name: Record optional candidate digests
        id: digests
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -euo pipefail
          embed=$(jq -er '.compat["containerimage.digest"] | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$METADATA")
          integrated=$(jq -er '.integrated["containerimage.digest"] | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$METADATA")
          jq -n --arg embed "$embed" --arg integrated "$integrated" \
            '{embed: $embed, integrated: $integrated}' > optional-candidate-digests.json
          echo "embed=$embed" >> "$GITHUB_OUTPUT"
          echo "integrated=$integrated" >> "$GITHUB_OUTPUT"
      - name: Prove optional image contracts
        env:
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          embed=$(jq -r .embed optional-candidate-digests.json)
          integrated=$(jq -r .integrated optional-candidate-digests.json)
          docker pull "$EMBED_IMAGE@$embed" >/dev/null
          test "$(docker image inspect "$EMBED_IMAGE@$embed" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$VERSION"
          id=$(docker run --rm -d -p 127.0.0.1:18081:8080 "$EMBED_IMAGE@$embed")
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          body=""
          for _ in $(seq 1 20); do
            body=$(curl -fsS http://127.0.0.1:18081/health 2>/dev/null) && break
            sleep 1
          done
          jq -e '.status == "ok" and .model == "bge-m3" and .dims == 1024 and
                 .vector_epoch == 1 and .max_tokens == 1024' <<<"$body"
          docker rm -f "$id" >/dev/null
          trap - EXIT

          docker pull "$INTEGRATED_IMAGE@$integrated" >/dev/null
          test "$(docker image inspect "$INTEGRATED_IMAGE@$integrated" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$VERSION"
          id=$(docker run --rm -d -p 127.0.0.1:18082:8080 "$INTEGRATED_IMAGE@$integrated")
          trap 'docker rm -f "$id" >/dev/null 2>&1 || true' EXIT
          body=""
          for _ in $(seq 1 20); do
            body=$(curl -fsS http://127.0.0.1:18082/health 2>/dev/null) && break
            sleep 1
          done
          jq -e '.status == "degraded" and .reason == "dataset_unavailable"' <<<"$body"
      - name: Scan compatibility image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.EMBED_IMAGE }}@${{ steps.digests.outputs.embed }}
          version: v0.74.0
          format: json
          output: trivy-embed.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Scan integrated image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.INTEGRATED_IMAGE }}@${{ steps.digests.outputs.integrated }}
          version: v0.74.0
          format: json
          output: trivy-integrated.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Gate optional images on fixable critical findings
        run: |
          trivy convert --severity CRITICAL --exit-code 1 --format table trivy-embed.json
          trivy convert --severity CRITICAL --exit-code 1 --format table trivy-integrated.json
      - name: Save optional candidate identities
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: optional-release-candidate-${{ github.sha }}
          path: optional-candidate-digests.json
          if-no-files-found: error
          retention-days: 30
      - name: Prepare optional image reports
        continue-on-error: true
        run: |
          trivy convert --format sarif --output trivy-embed.sarif trivy-embed.json
          trivy convert --format sarif --output trivy-integrated.sarif trivy-integrated.json
      - name: Upload compatibility scan
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: trivy-embed.sarif
          category: trivy-den-atlas-embed
      - name: Upload integrated scan
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        continue-on-error: true
        with:
          sarif_file: trivy-integrated.sarif
          category: trivy-den-atlas-integrated

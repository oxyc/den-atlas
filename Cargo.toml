[package]
name = "den-atlas"
version = "0.6.2"
edition = "2021"
description = "Self-hosted dataset addon for Den — serves the derived feature store (labels + int8 vectors) the app syncs on-device. Rust serving layer (RUST-1)."
license = "MIT"

[[bin]]
name = "den-atlas"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", default-features = false, features = ["tokio", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httpdate = "1"
# JustWatch catalog source (docs/CATALOG-justwatch.md): a GraphQL POST client (rustls, no OpenSSL) +
# async-trait so the source is injectable/mockable. Isolated to the catalog resource.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
async-trait = "0.1"

# Small static binary. The dataset serving layer is dependency-light; the catalog feature adds reqwest
# (rustls, no OpenSSL) + async-trait for the JustWatch source.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# Unwind (not abort): a stray panic in a request task drops that one connection instead of aborting the
# whole process into a crash-loop. Header/body builds are also made non-panicking (src/http.rs).

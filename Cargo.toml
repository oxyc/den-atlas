[package]
name = "den-atlas"
version = "0.49.0"
edition = "2021"
description = "Self-hosted dataset addon for Den — answers discovery queries out of the derived feature store (labels + int8 vectors). Rust serving layer (RUST-1)."
license = "MIT"
publish = false

[[bin]]
name = "den-atlas"
path = "src/main.rs"

[dependencies]
# The store: den-spec wire/store-v1. The DECODER is pure and lives in den-core so it also compiles for
# wasm32 (the tuning playground) and tvOS; the mmap is the one impure step and belongs here, to whoever
# owns the bytes. Pinned to a tag: this is a binary format contract, and Cargo.lock should say which
# version of it this build reads.
den-store = { git = "https://github.com/oxyc/den-core.git", tag = "den-store-v1.2" }
memmap2 = "0.9"
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
httpdate = "1"
# JustWatch catalog source (docs/CATALOG-justwatch.md): a GraphQL POST client (rustls, no OpenSSL) +
# async-trait so the source is injectable/mockable. Isolated to the catalog resource.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
async-trait = "0.1"
# Fuzzy title search (TITLE_SEARCH): the portable index crate, and a pure-Rust gunzip for TMDB's exports.
den-titlesearch = { path = "crates/den-titlesearch" }
# Index queries (INDEX_QUERIES): label rows and More Like This over the dataset, the portable crate.
den-index = { path = "crates/den-index" }
flate2 = "1"

[workspace]
members = ["crates/den-index", "crates/den-titlesearch"]

# `start_paused` — the cold-burst test simulates ~45s of queued upstream work, which has to cost no
# wall clock to be worth running. Tests only; the shipped binary's tokio features are unchanged.
#
# `blake2` is the store fixture's content hash (`store::fixture`). den-store VERIFIES that digest and does
# not expose the function, and a store is now the only thing the serving path reads, so every test with a
# dataset in it needs one written. A real implementation, not a second copy of den-store's vendored one:
# the fixture must fail when the writer is wrong, not agree with it.
[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
blake2 = "0.10"

# Speed over size, everywhere: every More Like This, search and row walks tens of thousands of records, the
# index load parses tens of megabytes of JSON, and a size-optimised build ("z", with a per-crate override that
# the LTO link didn't honour) left the dot-product loop at scalar speed. The binary is a few MB larger, next to
# 75 MB of vectors it holds. The catalog feature adds reqwest (rustls, no OpenSSL) + async-trait.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# Unwind (not abort): a stray panic in a request task drops that one connection instead of aborting the
# whole process into a crash-loop. Header/body builds are also made non-panicking (src/http.rs).
